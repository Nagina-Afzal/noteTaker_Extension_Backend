# docker-compose.yml — local development / self-host for the backend.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.vercel
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
